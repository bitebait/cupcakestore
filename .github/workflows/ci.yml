name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check browser JavaScript syntax
        run: |
          for script in web/js/*.js; do
            node --check "$script"
          done
      - name: Build
        run: go build ./...
      - name: Test with race detection
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start isolated store
        run: docker compose -p cupcake-ci up --build --wait --wait-timeout 120
      - name: Verify readiness and storefront
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/store
          curl --compressed --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/css/ui.css
      - name: Container logs
        if: failure()
        run: docker compose -p cupcake-ci logs --no-color --tail 100
      - name: Remove isolated test resources
        if: always()
        run: docker compose -p cupcake-ci down --volumes --remove-orphans
