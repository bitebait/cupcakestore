<script>
    document.getElementById('show-password-button').addEventListener('click', function () {
        const inputs = document.querySelectorAll('.password-field');
        const showPassword = document.getElementById('password').type === 'password';
        inputs.forEach(input => { input.type = showPassword ? 'text' : 'password'; });
        this.setAttribute('aria-pressed', String(showPassword));
        this.setAttribute('aria-label', showPassword ? 'Ocultar senha' : 'Mostrar senha');
        const icon = document.getElementById('show-password-icon');
        icon.classList.toggle('fa-eye', !showPassword);
        icon.classList.toggle('fa-eye-slash', showPassword);
    });
</script>
