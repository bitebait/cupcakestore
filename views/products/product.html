<div class="content-header">
    <div class="container">
        <a href="/products" class="text-muted">← Produtos</a>
        <h1 class="mt-2">Editar produto</h1>
        <p class="text-muted">#{{.Object.ID}} · {{.Object.Name}}</p>
    </div>
</div>
<section class="content">
    <div class="container">
        <form method="post" action="/products/update/{{.Object.ID}}" enctype="multipart/form-data" class="card">
            <input type="hidden" name="_csrf" autocomplete="off" value="{{ .CSRFToken }}">
            <div class="card-body">{{template "products/form-fields" .}}</div>
            <div class="card-footer d-flex justify-content-between flex-wrap">
                <div>
                    <a href="/products" class="btn btn-default">Cancelar</a>
                    <a href="/products/delete/{{.Object.ID}}" class="btn btn-outline-danger">Excluir produto</a>
                </div>
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
        </form>
    </div>
</section>
