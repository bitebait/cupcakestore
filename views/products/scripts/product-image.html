<script>
    (() => {
        const fileInput = document.getElementById('image');
        const statusElement = document.getElementById('imageLabel');
        const previewImage = document.getElementById('previewImage');
        const originalImage = previewImage.src;
        const maxFileSize = 4 * 1024 * 1024;
        let previewURL;

        statusElement.setAttribute('role', 'status');
        fileInput.setAttribute('aria-describedby', 'imageLabel');

        fileInput.addEventListener('change', () => {
            if (previewURL) {
                URL.revokeObjectURL(previewURL);
                previewURL = null;
            }
            previewImage.src = originalImage;
            const file = fileInput.files[0];
            if (!file) {
                statusElement.textContent = 'Escolher Imagem do Produto';
                statusElement.style.color = '';
                return;
            }
            if (!['image/png', 'image/jpeg', 'image/gif'].includes(file.type) || file.size > maxFileSize) {
                fileInput.value = '';
                statusElement.textContent = 'Selecione uma imagem PNG, JPEG ou GIF de até 4 MB.';
                statusElement.style.color = '#b21f2d';
                return;
            }
            statusElement.textContent = 'Imagem selecionada: ' + file.name;
            statusElement.style.color = '';
            previewURL = URL.createObjectURL(file);
            previewImage.src = previewURL;
        });
    })();
</script>
